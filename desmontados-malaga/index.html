<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src https: data:; script-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf6f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
<title>Desmontados Málaga</title>

<link rel="canonical" href="https://carta.pentafer.es/desmontados-malaga/">
<style>
:root{--bg:#faf6f0;--card:#fffdf9;--ink:#221d18;--muted:#6f655b;--line:#e7ddd0;--accent:#9c4a2a;--accent-soft:#f3e3d9;--ok:#2f6b4f}
@media (prefers-color-scheme:dark){:root{--bg:#16130f;--card:#1f1b16;--ink:#f1ebe3;--muted:#a79c8f;--line:#3a332b;--accent:#e08a61;--accent-soft:#3a2a22;--ok:#7bc39c}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
header.top{padding:36px 0 18px;text-align:center}
.brand{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:2.1rem;letter-spacing:.01em;margin:0;line-height:1.1}
.sub{color:var(--muted);margin:.4rem 0 0;font-size:.95rem}
nav.cats{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.cats ul{list-style:none;margin:0;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:680px;margin:0 auto}
nav.cats ul::-webkit-scrollbar{display:none}
nav.cats a{display:block;white-space:nowrap;padding:7px 14px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:.9rem;background:var(--card)}
nav.cats a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section.sec{padding:26px 0 6px}
h2{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:600;font-size:1.45rem;margin:0 0 4px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.secdesc{color:var(--muted);margin:0 0 8px;font-size:.92rem}
.item{padding:14px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.row{display:flex;gap:12px;align-items:baseline;justify-content:space-between}
h3{margin:0;font-size:1.02rem;font-weight:600}
.price{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.prices{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:.93rem}
.prices span{white-space:nowrap}.prices b{font-weight:600;font-variant-numeric:tabular-nums}
.prices i{font-style:normal;color:var(--muted);margin-right:4px}
.desc{color:var(--muted);margin:3px 0 0;font-size:.92rem}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:.72rem;letter-spacing:.02em;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.al{font-size:.68rem;padding:2px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.agotado h3,.agotado .price,.agotado .prices{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.agotado .tag.out{background:transparent;border:1px solid var(--muted);color:var(--muted);text-decoration:none}
footer{padding:28px 0 48px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);margin-top:24px}
footer h4{margin:0 0 8px;font-size:.85rem;color:var(--ink)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;margin:0 0 16px;padding:0;list-style:none}
.legend .al{margin-right:6px}
.cols{display:grid;grid-template-columns:1fr repeat(var(--n),minmax(58px,auto));column-gap:14px;align-items:baseline}
.cols .p{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.colhead{padding:4px 0 2px;border-bottom:1px solid var(--line);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.colhead span{text-align:right}
.agotado .cols .p{color:var(--muted);text-decoration:line-through}
.empty{padding:80px 0;text-align:center;color:var(--muted)}
.list a{display:block;padding:18px;margin:12px 0;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);text-decoration:none;font-size:1.1rem}
.list small{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
</style></head>
<body><main class="wrap"><header class="top"><h1 class="brand">Desmontados Málaga</h1></header><div class="empty">Estamos preparando la carta.<br>Pregunta al personal, estaremos encantados de ayudarte.</div></main></body></html>
